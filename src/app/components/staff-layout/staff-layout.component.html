<div class="staff-shell">

  <aside class="sidebar">

    <div>

      <div class="brand">

        <div class="brand-icon">
          D
        </div>

        <div class="brand-text">
          <h2>Dintest</h2>
          <span>Dental Clinic</span>
        </div>

      </div>


      <div class="menu-label">
        MANAGEMENT
      </div>


      <nav class="nav-menu">

        <a
          routerLink="/dashboard"
          routerLinkActive="active" ariaCurrentWhenActive="page"
          class="nav-item"
        >
          <span class="nav-icon">⌂</span>

          Dashboard
        </a>


        <a
          routerLink="/appointments"
          routerLinkActive="active" ariaCurrentWhenActive="page"
          class="nav-item"
        >
          <span class="nav-icon">▣</span>

          Appointments
        </a>


        <a
          routerLink="/patients"
          routerLinkActive="active" ariaCurrentWhenActive="page"
          class="nav-item"
        >
          <span class="nav-icon">♙</span>

          Patients
        </a>


        <a
          routerLink="/dentists"
          routerLinkActive="active" ariaCurrentWhenActive="page"
          class="nav-item"
        >
          <span class="nav-icon">+</span>

          Dentists
        </a>


        <a
          routerLink="/services-management"
          routerLinkActive="active" ariaCurrentWhenActive="page"
          class="nav-item"
        >
          <span class="nav-icon">◇</span>

          Services
        </a>

        <a *ngIf="canViewBilling" routerLink="/billing" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item"><span class="nav-icon">$</span>Invoices &amp; payments</a>
      </nav>

    </div>


    <div class="sidebar-footer">

      <div class="staff-label">
        STAFF PORTAL
      </div>

      <button
        type="button"
        class="logout-button"
        (click)="logout()"
      >
        Logout
      </button>

    </div>

  </aside>


  <!-- Angular places the selected staff page here -->
  <main class="staff-content" [attr.aria-busy]="isNavigating">
    <div class="app-context-bar"><nav aria-label="Breadcrumb"><a routerLink="/dashboard">Workspace</a><span aria-hidden="true">/</span><strong>{{ currentApp }}</strong></nav><a class="back-workspace" routerLink="/dashboard" *ngIf="currentApp !== 'Dashboard'">&larr; All apps</a><span class="workspace-state" *ngIf="currentApp === 'Dashboard'">Clinic workspace</span></div>
    <div class="route-progress" *ngIf="isNavigating" role="status" aria-label="Opening app"></div>

    <router-outlet>
    </router-outlet>

  </main>

</div>
