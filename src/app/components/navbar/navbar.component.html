<nav class="navbar">
  <div class="nav-container">
    <!-- =========================
         LOGO
    ========================== -->
    <a class="brand" routerLink="/" fragment="home">
      <div class="tooth-logo">
        <svg viewBox="0 0 64 72" aria-hidden="true">
          <path
            d="M32 10
         C25 10 21 5 14 7
         C6 9 3 17 5 27
         C7 36 11 43 13 53
         C15 62 19 67 23 67
         C28 67 28 55 32 48
         C36 55 36 67 41 67
         C45 67 49 62 51 53
         C53 43 57 36 59 27
         C61 17 58 9 50 7
         C43 5 39 10 32 10Z"
          />
        </svg>
      </div>

      <div class="brand-text">
        <span class="brand-name">Dintest</span>
        <span class="brand-subtitle">DENTAL CLINIC</span>
      </div>
    </a>

    <!-- =========================
         NAVIGATION
    ========================== -->
    <div class="nav-links" id="public-menu" [class.mobile-open]="menuOpen">
      <a routerLink="/" fragment="home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page"> Home </a>

      <a *ngIf="patientAuth.getToken()" routerLink="/my-appointments" routerLinkActive="active" (click)="menuOpen = false">My appointments</a>
      <a routerLink="/services" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="menuOpen = false"> Services </a>

      <a routerLink="/team" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="menuOpen = false"> Our Team </a>

      <a routerLink="/about" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="menuOpen = false"> About </a>

      <a routerLink="/contact" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="menuOpen = false"> Contact </a>
    </div>

    <!-- =========================
         BOOK APPOINTMENT
    ========================== -->
    <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="public-menu" aria-label="Toggle navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="book-button" type="button" routerLink="/book" (click)="menuOpen = false">
      <!-- Calendar Icon -->
      <svg class="calendar-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M7 2v3M17 2v3M3 9h18M5 4h14
             a2 2 0 0 1 2 2v13
             a2 2 0 0 1-2 2H5
             a2 2 0 0 1-2-2V6
             a2 2 0 0 1 2-2Z"
        />
      </svg>

      <span>Book Appointment</span>
    </button>
  </div>
</nav>
